<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עונות השנה — אורך יום לפי קו רוחב</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#07101f; color:#f0f4f8;
  font-family:system-ui,sans-serif;
  height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:10px; overflow:hidden; padding:8px;
}
h2 { font-size:.88rem; color:#00b8d4; text-align:center; letter-spacing:.02em; }
canvas { display:block; max-width:100%; height:auto; }
.slider-row {
  display:flex; align-items:center; gap:10px;
  width:100%; max-width:520px;
}
.slider-row label { font-size:.78rem; color:#a8b8cc; white-space:nowrap; min-width:60px; text-align:center; }
#month-slider { flex:1; accent-color:#00b8d4; height:4px; }
.month-name { font-size:.9rem; font-weight:700; color:#00b8d4; text-align:center; min-width:140px; }
.key-info {
  display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
  width:100%; max-width:520px; font-size:.72rem;
}
.ki {
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  border-radius:6px; padding:5px 8px; text-align:center; line-height:1.4;
}
.ki strong { display:block; margin-bottom:2px; }
.ki.polar   { border-color:rgba(100,220,255,.35); }
.ki.polar   strong { color:#64dcff; }
.ki.israel  { border-color:rgba(255,140,66,.35); }
.ki.israel  strong { color:#ff8c42; }
.ki.equator { border-color:rgba(255,100,100,.4); }
.ki.equator strong { color:#ff6464; }
</style>
</head>
<body>
<h2>עונות השנה — אורך יום לפי קו רוחב</h2>
<canvas id="cv" width="520" height="280"></canvas>
<div class="slider-row">
  <label>ינואר</label>
  <input type="range" id="month-slider" min="0" max="11" value="5" step="1">
  <label>דצמבר</label>
</div>
<div class="month-name" id="mname">יוני — קיצה קיץ</div>
<div class="key-info">
  <div class="ki polar">
    <strong id="lbl-arctic">חוג הקוטב הצפוני 66.5°N</strong>
    <span id="val-arctic">24 שע׳ אור</span>
  </div>
  <div class="ki israel">
    <strong>ישראל 31°N</strong>
    <span id="val-israel">14.6 שע׳ אור</span>
  </div>
  <div class="ki equator">
    <strong>קו המשווה 0°</strong>
    <span id="val-equator">12 שע׳ אור</span>
  </div>
</div>

<script>
const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
const W = 520, H = 280;
const R  = 95, ECX = 178, ECY = H/2;

// Earth axis — ALWAYS upper-right at 23.5°
const TILT = 23.5 * Math.PI / 180;
const sinT = Math.sin(TILT), cosT = Math.cos(TILT);

// Africa-centered orthographic projection (20°E, 5°N)
const VL = 20*Math.PI/180, VB = 5*Math.PI/180;
const sVB = Math.sin(VB), cVB = Math.cos(VB);

function proj(lonDeg, latDeg) {
  const lo = lonDeg*Math.PI/180, la = latDeg*Math.PI/180;
  const c = sVB*Math.sin(la) + cVB*Math.cos(la)*Math.cos(lo-VL);
  if (c < 0) return null;
  return [ECX + R*Math.cos(la)*Math.sin(lo-VL),
          ECY - R*(cVB*Math.sin(la) - sVB*Math.cos(la)*Math.cos(lo-VL))];
}

function fillR(pts, color) {
  ctx.beginPath(); let first=true;
  for (const [lo,la] of pts) {
    const p=proj(lo,la); if(!p) continue;
    first?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]); first=false;
  }
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
}

const REGIONS = [
  {c:'#be8f4a',pts:[[-16,33],[-12,36],[-2,37],[8,36],[17,33],[26,30],[33,30],[38,28],[40,22],[40,13],[38,8],[32,3],[30,0],[24,-2],[16,-2],[10,0],[5,3],[0,5],[-5,4],[-10,4],[-15,5],[-17,8],[-16,16],[-16,33]]},
  {c:'#4a8028',pts:[[-16,16],[-15,5],[-10,4],[-5,4],[0,5],[5,3],[10,0],[10,-5],[6,-9],[2,-10],[-2,-8],[-6,-5],[-10,-2],[-14,3],[-16,8],[-16,16]]},
  {c:'#245e18',pts:[[10,0],[16,-1],[22,-3],[28,-1],[32,3],[30,5],[26,4],[22,-2],[20,-6],[17,-9],[13,-8],[10,-5],[10,0]]},
  {c:'#8a7838',pts:[[32,3],[35,8],[38,12],[42,13],[46,11],[44,8],[43,3],[44,0],[42,-4],[40,-6],[38,-2],[35,4],[32,5],[30,3],[32,3]]},
  {c:'#588028',pts:[[10,-5],[13,-8],[17,-9],[20,-6],[22,-2],[26,4],[30,3],[32,5],[35,4],[38,-2],[40,-6],[42,-11],[40,-18],[38,-25],[35,-35],[28,-36],[22,-34],[17,-30],[14,-24],[12,-17],[10,-12],[7,-9],[5,-6],[3,-2],[5,3],[10,0],[10,-5]]},
  {c:'#c8a050',pts:[[35,30],[37,28],[40,24],[43,21],[48,18],[52,14],[57,11],[60,11],[57,15],[55,20],[52,24],[47,24],[45,22],[43,18],[40,16],[38,22],[35,28],[35,30]]},
  {c:'#b09055',pts:[[32,30],[36,33],[38,35],[42,37],[47,37],[50,34],[52,31],[50,28],[47,27],[44,28],[42,22],[40,24],[38,28],[35,30],[35,33],[32,33],[32,30]]},
  {c:'#c0a050',pts:[[30,29],[32,31],[35,30],[34,26],[31,25],[30,29]]},
  {c:'#689840',pts:[[-10,36],[-8,38],[-5,42],[-3,44],[0,46],[5,48],[8,47],[10,48],[14,48],[18,50],[22,50],[27,50],[30,47],[28,44],[32,41],[28,38],[24,38],[22,38],[20,38],[18,40],[16,40],[14,36],[13,38],[11,44],[8,44],[5,44],[0,43],[-3,43],[-7,40],[-8,38],[-10,36]]},
  {c:'#8a9c48',pts:[[-10,36],[-9,39],[-8,41],[-5,44],[0,46],[0,43],[0,40],[-3,38],[-5,36],[-8,36],[-10,36]]},
  {c:'#989a56',pts:[[26,38],[28,38],[30,41],[36,40],[40,37],[42,37],[40,36],[36,37],[32,36],[28,36],[26,36],[26,38]]},
  {c:'#9a9858',pts:[[44,28],[47,27],[50,28],[52,31],[56,28],[60,24],[57,22],[55,22],[52,24],[47,24],[44,26],[44,28]]},
  {c:'#5a8833',pts:[[5,55],[8,57],[10,58],[14,58],[18,60],[22,63],[20,67],[16,68],[12,65],[10,63],[8,59],[5,56],[5,55]]},
  {c:'#5e8838',pts:[[-5,50],[0,52],[1,52],[-2,57],[-4,58],[-6,55],[-5,50]]},
  {c:'#588830',pts:[[43,-12],[46,-14],[50,-18],[50,-23],[48,-25],[46,-25],[43,-22],[43,-17],[43,-12]]},
  {c:'#c8e0f0',pts:[[-52,60],[-42,62],[-30,63],[-20,65],[-18,72],[-24,80],[-40,83],[-52,78],[-56,70],[-52,60]]},
  {c:'#789040',pts:[[65,22],[68,20],[72,18],[76,14],[78,8],[75,10],[72,12],[68,14],[65,18],[62,20],[65,22]]},
];

const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const MONTH_SUFFIX = ['','','— שוויון אביב','','','— קיצה קיץ','','','— שוויון סתיו','','','— קיצה חורף'];

// Declination: +23.45° in June (m=5), -23.45° in December (m=11)
function declination(m) {
  return 23.45 * Math.cos(2*Math.PI*(m-5)/12);
}

// Day-length fraction using fixed-axis geometry.
// Axis ALWAYS upper-right at 23.5°; sun flips sides with season.
// tau = -tan(phi)*tan(|delta|)
// sunRight (delta>0): day = right part → frac = (1-tau)/2
// sunLeft  (delta<0): day = left  part → frac = (1+tau)/2
function dayFraction(phi_deg, delta_deg) {
  if (Math.abs(phi_deg) >= 89.9) return (phi_deg * delta_deg > 0) ? 1 : 0;
  const absDelta = Math.abs(delta_deg);
  const tau = -Math.tan(phi_deg*Math.PI/180) * Math.tan(absDelta*Math.PI/180);
  const tc = Math.max(-1, Math.min(1, tau));
  return delta_deg >= 0 ? (1-tc)/2 : (1+tc)/2;
}

function hoursLabel(frac) {
  if (frac >= 0.9999) return 'שמש חצות (24 שע׳)';
  if (frac <= 0.0001) return 'לילה קוטבי (0 שע׳)';
  return (frac*24).toFixed(1) + ' שע׳ אור';
}

function render(month) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle='#07101f'; ctx.fillRect(0,0,W,H);

  const delta    = declination(month);
  const absDelta = Math.abs(delta);
  const sunRight = delta >= 0;
  const SX = sunRight ? W-26 : 26;

  // Stars
  if (!render._stars) render._stars = Array.from({length:60},()=>[Math.random()*W,Math.random()*H,Math.random()*1+0.3]);
  ctx.fillStyle='rgba(255,255,255,.45)';
  render._stars.forEach(([sx,sy,sr])=>{ ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill(); });

  // ── Sun ──
  const sg = ctx.createRadialGradient(SX,ECY,4,SX,ECY,50);
  sg.addColorStop(0,'#fffde8'); sg.addColorStop(.55,'#ffcc00'); sg.addColorStop(1,'rgba(255,100,0,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(SX,ECY,50,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(SX,ECY,20,0,Math.PI*2); ctx.fill();
  ctx.font='bold 7px system-ui'; ctx.fillStyle='#0a1628'; ctx.textAlign='center';
  ctx.fillText('שמש',SX,ECY+3);

  // Rays toward Earth
  ctx.strokeStyle='rgba(255,200,0,.45)'; ctx.lineWidth=1;
  const r0 = sunRight ? SX-24 : SX+24;
  const r1 = sunRight ? ECX+R+2 : ECX-R-2;
  for (let yo=-85; yo<=85; yo+=16) {
    ctx.beginPath(); ctx.moveTo(r0,ECY+yo); ctx.lineTo(r1,ECY+yo); ctx.stroke();
  }

  // ── Earth (clipped globe) ──
  ctx.save();
  ctx.beginPath(); ctx.arc(ECX,ECY,R,0,Math.PI*2); ctx.clip();

  // Night base
  ctx.fillStyle='#030b18'; ctx.fillRect(ECX-R-2,ECY-R-2,2*R+4,2*R+4);

  // Ocean day gradient (sun side)
  const og = ctx.createRadialGradient(
    sunRight?ECX+R*.35:ECX-R*.35, ECY-R*.22, R*.08, ECX, ECY, R);
  og.addColorStop(0,'#52b8e5'); og.addColorStop(.25,'#1878b8');
  og.addColorStop(.65,'#0c4278'); og.addColorStop(.9,'#071c50'); og.addColorStop(1,'#020c18');
  ctx.beginPath();
  if (sunRight) ctx.arc(ECX,ECY,R,-Math.PI/2,Math.PI/2);
  else          ctx.arc(ECX,ECY,R, Math.PI/2,3*Math.PI/2);
  ctx.lineTo(ECX,ECY); ctx.closePath(); ctx.fillStyle=og; ctx.fill();

  // Continents
  REGIONS.forEach(reg => fillR(reg.pts, reg.c));

  // Polar ice
  const nPole=proj(0,90), sPole=proj(0,-90);
  if(nPole){ctx.beginPath();ctx.arc(nPole[0],nPole[1],R*.15,0,Math.PI*2);ctx.fillStyle='#cce8f5';ctx.fill();}
  if(sPole){ctx.beginPath();ctx.arc(sPole[0],sPole[1],R*.19,0,Math.PI*2);ctx.fillStyle='#d8eef5';ctx.fill();}

  // Night overlay
  ctx.beginPath();
  if (sunRight) ctx.arc(ECX,ECY,R, Math.PI/2,3*Math.PI/2);
  else          ctx.arc(ECX,ECY,R,-Math.PI/2,  Math.PI/2);
  ctx.lineTo(ECX,ECY); ctx.closePath();
  ctx.fillStyle='rgba(2,8,22,.89)'; ctx.fill();

  // 3D shading
  const sh = ctx.createRadialGradient(
    sunRight?ECX+R*.32:ECX-R*.32, ECY-R*.22, R*.05, ECX, ECY, R);
  sh.addColorStop(0,'rgba(255,255,255,.18)'); sh.addColorStop(.38,'rgba(255,255,255,.03)');
  sh.addColorStop(.82,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,30,.34)');
  ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(ECX,ECY,R,0,Math.PI*2); ctx.fill();

  ctx.restore();

  // Earth outline + atmosphere
  ctx.strokeStyle='rgba(0,160,220,.45)'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(ECX,ECY,R,0,Math.PI*2); ctx.stroke();
  const atm=ctx.createRadialGradient(ECX,ECY,R-2,ECX,ECY,R+14);
  atm.addColorStop(0,'rgba(60,160,255,.22)'); atm.addColorStop(1,'transparent');
  ctx.fillStyle=atm; ctx.beginPath(); ctx.arc(ECX,ECY,R+14,0,Math.PI*2); ctx.fill();

  // Terminator
  ctx.strokeStyle='rgba(0,220,255,.6)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(ECX,ECY-R); ctx.lineTo(ECX,ECY+R); ctx.stroke();
  ctx.setLineDash([]);

  // ── Latitude segments ──
  const absDeltaRad = absDelta * Math.PI / 180;
  [90,66.5,31,23.5,0,-23.5,-31,-66.5,-90].forEach(ld => {
    const phi=ld*Math.PI/180, sp=Math.sin(phi), cp=Math.cos(phi);
    const cxs=ECX+R*sp*sinT, cys=ECY-R*sp*cosT;
    const hx=R*cp*cosT,      hy=R*cp*sinT;
    const tau_raw = (Math.abs(ld)>=89.9)
      ? (ld>0?-1:1)
      : -Math.tan(phi)*Math.tan(absDeltaRad);
    const tau=Math.max(-1,Math.min(1,tau_raw));
    const xs=cxs+hx*tau, ys=cys+hy*tau;
    const x1=cxs-hx,y1=cys-hy, x2=cxs+hx,y2=cys+hy;

    const col=ld===0?'rgba(255,80,80,.88)':(Math.abs(ld)===23.5?'rgba(255,200,50,.85)':'rgba(100,220,255,.85)');
    const nc='rgba(20,45,120,.45)';
    const lw=(ld===0||Math.abs(ld)===66.5||Math.abs(ld)===90)?2.2:1.2;

    if (sunRight) {
      // day = right portion (xs → x2)
      if(tau<1) {ctx.beginPath();ctx.moveTo(xs,ys);ctx.lineTo(x2,y2);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke();}
      if(tau>-1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(xs,ys);ctx.strokeStyle=nc;ctx.lineWidth=lw;ctx.stroke();}
    } else {
      // day = left portion (x1 → xs)
      if(tau>-1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(xs,ys);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke();}
      if(tau<1) {ctx.beginPath();ctx.moveTo(xs,ys);ctx.lineTo(x2,y2);ctx.strokeStyle=nc;ctx.lineWidth=lw;ctx.stroke();}
    }
  });

  // ── Axis — ALWAYS upper-right at 23.5° ──
  const aL=R+18;
  const axNX=ECX+aL*sinT, axNY=ECY-aL*cosT;
  const axSX=ECX-aL*sinT, axSY=ECY+aL*cosT;
  ctx.strokeStyle='#ffd060'; ctx.lineWidth=2.2; ctx.setLineDash([5,3]);
  ctx.beginPath(); ctx.moveTo(axSX,axSY); ctx.lineTo(axNX,axNY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font='bold 9px system-ui'; ctx.fillStyle='#ffd060'; ctx.textAlign='center';
  ctx.fillText('N',axNX,axNY-5); ctx.fillText('S',axSX,axSY+11);
  // Tilt arc
  ctx.strokeStyle='rgba(255,200,0,.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(ECX,ECY-R-2,14,-Math.PI/2,-Math.PI/2+TILT,false); ctx.stroke();
  ctx.font='8px system-ui'; ctx.fillStyle='#ffd060'; ctx.textAlign='left';
  ctx.fillText('23.5°',axNX+3,axNY+1);

  // Day / Night labels
  ctx.font='bold 9px system-ui'; ctx.textAlign='center';
  ctx.fillStyle='rgba(255,210,80,.72)';
  ctx.fillText('יום ☀',sunRight?ECX+R*.55:ECX-R*.55, ECY+R+16);
  ctx.fillStyle='rgba(80,120,200,.62)';
  ctx.fillText('לילה ☾',sunRight?ECX-R*.55:ECX+R*.55, ECY+R+16);

  // ── Right panel: latitude labels ──
  const LABEL_LATS = [
    {deg:90,   label:'קוטב N',       color:'#88d8ff'},
    {deg:66.5, label:'66.5°N',       color:'#64dcff'},
    {deg:31,   label:'31°N ישראל',   color:'#ff9955'},
    {deg:0,    label:'0° משווה',     color:'#ff7070'},
    {deg:-66.5,label:'66.5°S',       color:'#88c0ff'},
    {deg:-90,  label:'קוטב S',       color:'#88d8ff'},
  ];
  ctx.font='8px system-ui'; ctx.textAlign='right';
  LABEL_LATS.forEach(({deg,label,color}) => {
    const phi=deg*Math.PI/180, sp=Math.sin(phi), cp=Math.cos(phi);
    const cxs=ECX+R*sp*sinT, cys=ECY-R*sp*cosT;
    const hx2=R*cp*cosT, hy2=R*cp*sinT;
    const rx=cxs+hx2, ry=cys+hy2;
    ctx.fillStyle=color;
    ctx.fillText(label, W-8, ry+3);
    ctx.strokeStyle=color; ctx.globalAlpha=0.28; ctx.lineWidth=0.7; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(rx+3,ry); ctx.lineTo(W-62,ry); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  });

  // ── Update info cards ──
  const arcticFrac  = dayFraction(66.5, delta);
  const israelFrac  = dayFraction(31,   delta);
  const equatorFrac = dayFraction(0,    delta);

  document.getElementById('val-arctic').textContent  = hoursLabel(arcticFrac);
  document.getElementById('val-israel').textContent  = hoursLabel(israelFrac);
  document.getElementById('val-equator').textContent = hoursLabel(equatorFrac);
  document.getElementById('lbl-arctic').textContent  = delta >= 0
    ? 'חוג הקוטב הצפוני 66.5°N' : 'חוג הקוטב הדרומי 66.5°S';

  const suffix = MONTH_SUFFIX[month];
  document.getElementById('mname').textContent = MONTHS[month] + (suffix?' '+suffix:'');
}

const slider = document.getElementById('month-slider');
render(parseInt(slider.value));
slider.addEventListener('input', () => render(parseInt(slider.value)));
</script>
</body>
</html>
