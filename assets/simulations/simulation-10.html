<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כדור הארץ והשמש — קיץ וחורף</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#07101f; color:#f0f4f8;
  font-family:system-ui,sans-serif;
  height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:8px; overflow:hidden; padding:8px;
}
h2 { font-size:.88rem; color:#00b8d4; text-align:center; }
.toggle-row { display:flex; border:1px solid rgba(0,184,212,.4); border-radius:8px; overflow:hidden; }
.tbtn { padding:6px 20px; font-size:.82rem; background:transparent; color:#a8b8cc; border:none; cursor:pointer; transition:background .2s,color .2s; }
.tbtn.active { background:rgba(0,184,212,.28); color:#f0f4f8; font-weight:700; }
canvas { display:block; max-width:100%; height:auto; }
.fact-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; max-width:500px; width:100%; font-size:.75rem; }
.fc { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px 12px; text-align:center; line-height:1.45; }
.fc strong { display:block; margin-bottom:4px; font-size:.76rem; }
.fc.north { border-color:rgba(255,140,66,.4); }
.fc.north strong { color:#ff8c42; }
.fc.south { border-color:rgba(100,180,255,.4); }
.fc.south strong { color:#4fc3f7; }
</style>
</head>
<body>
<h2>כדור הארץ והשמש — השוואת עונות</h2>
<div class="toggle-row">
  <button class="tbtn active" id="btn-june" onclick="setSeason('june')">☀️ יוני — קיץ צפוני</button>
  <button class="tbtn" id="btn-dec" onclick="setSeason('dec')">❄️ דצמבר — חורף צפוני</button>
</div>
<canvas id="cv" width="500" height="248"></canvas>
<div class="fact-row">
  <div class="fc north">
    <strong id="fn-title">חצי כדור צפוני ☀️ — קיץ</strong>
    <span id="fn-text">הציר נוטה לשמש<br>יום ארוך • חם<br>ישראל: ~14.6 שע׳ אור</span>
  </div>
  <div class="fc south">
    <strong id="fs-title">חצי כדור דרומי ❄️ — חורף</strong>
    <span id="fs-text">מרוחק מהשמש<br>לילה ארוך • קר<br>ניו-זילנד: ~9.5 שע׳ אור</span>
  </div>
</div>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const W = 500, H = 248;
const R = 88, ECX = 250, ECY = H / 2;

// Earth's axis — always upper-right at 23.5°
const TILT = 23.5 * Math.PI / 180;
const sinT = Math.sin(TILT), cosT = Math.cos(TILT);

// Orthographic projection — Africa-centered view (20°E, 5°N)
const VL = 20 * Math.PI / 180, VB = 5 * Math.PI / 180;
const sVB = Math.sin(VB), cVB = Math.cos(VB);

function proj(lonDeg, latDeg) {
  const lo = lonDeg * Math.PI / 180, la = latDeg * Math.PI / 180;
  const c = sVB * Math.sin(la) + cVB * Math.cos(la) * Math.cos(lo - VL);
  if (c < 0) return null;
  return [
    ECX + R * Math.cos(la) * Math.sin(lo - VL),
    ECY - R * (cVB * Math.sin(la) - sVB * Math.cos(la) * Math.cos(lo - VL))
  ];
}

function fillR(pts, color) {
  ctx.beginPath();
  let first = true;
  for (const [lo, la] of pts) {
    const p = proj(lo, la);
    if (!p) continue;
    first ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]);
    first = false;
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

// Continent regions — Africa-centered orthographic view
const REGIONS = [
  // North Africa / Sahara (sandy)
  { c:'#be8f4a', pts:[[-16,33],[-12,36],[-2,37],[8,36],[17,33],[26,30],[33,30],[38,28],[40,22],[40,13],[38,8],[32,3],[30,0],[24,-2],[16,-2],[10,0],[5,3],[0,5],[-5,4],[-10,4],[-15,5],[-17,8],[-16,16],[-16,33]] },
  // West Africa (green savanna)
  { c:'#4a8028', pts:[[-16,16],[-15,5],[-10,4],[-5,4],[0,5],[5,3],[10,0],[10,-5],[6,-9],[2,-10],[-2,-8],[-6,-5],[-10,-2],[-14,3],[-16,8],[-16,16]] },
  // Equatorial / Congo (dark rainforest)
  { c:'#245e18', pts:[[10,0],[16,-1],[22,-3],[28,-1],[32,3],[30,5],[26,4],[22,-2],[20,-6],[17,-9],[13,-8],[10,-5],[10,0]] },
  // East Africa / Horn (semi-arid)
  { c:'#8a7838', pts:[[32,3],[35,8],[38,12],[42,13],[46,11],[44,8],[43,3],[44,0],[42,-4],[40,-6],[38,-2],[35,4],[32,5],[30,3],[32,3]] },
  // Southern Africa (mixed)
  { c:'#588028', pts:[[10,-5],[13,-8],[17,-9],[20,-6],[22,-2],[26,4],[30,3],[32,5],[35,4],[38,-2],[40,-6],[42,-11],[40,-18],[38,-25],[35,-35],[28,-36],[22,-34],[17,-30],[14,-24],[12,-17],[10,-12],[7,-9],[5,-6],[3,-2],[5,3],[10,0],[10,-5]] },
  // Arabian Peninsula (desert)
  { c:'#c8a050', pts:[[35,30],[37,28],[40,24],[43,21],[48,18],[52,14],[57,11],[60,11],[57,15],[55,20],[52,24],[47,24],[45,22],[43,18],[40,16],[38,22],[35,28],[35,30]] },
  // Levant / Fertile Crescent
  { c:'#b09055', pts:[[32,30],[36,33],[38,35],[42,37],[47,37],[50,34],[52,31],[50,28],[47,27],[44,28],[42,22],[40,24],[38,28],[35,30],[35,33],[32,33],[32,30]] },
  // Sinai
  { c:'#c0a050', pts:[[30,29],[32,31],[35,30],[34,26],[31,25],[30,29]] },
  // Europe (mixed greens)
  { c:'#689840', pts:[[-10,36],[-8,38],[-5,42],[-3,44],[0,46],[5,48],[8,47],[10,48],[14,48],[18,50],[22,50],[27,50],[30,47],[28,44],[32,41],[28,38],[24,38],[22,38],[20,38],[18,40],[16,40],[14,36],[13,38],[11,44],[8,44],[5,44],[0,43],[-3,43],[-7,40],[-8,38],[-10,36]] },
  // Iberian Peninsula (drier)
  { c:'#8a9c48', pts:[[-10,36],[-9,39],[-8,41],[-5,44],[0,46],[0,43],[0,40],[-3,38],[-5,36],[-8,36],[-10,36]] },
  // Turkey / Anatolia
  { c:'#989a56', pts:[[26,38],[28,38],[30,41],[36,40],[40,37],[42,37],[40,36],[36,37],[32,36],[28,36],[26,36],[26,38]] },
  // Iran (partially visible)
  { c:'#9a9858', pts:[[44,28],[47,27],[50,28],[52,31],[56,28],[60,24],[57,22],[55,22],[52,24],[47,24],[44,26],[44,28]] },
  // Scandinavia
  { c:'#5a8833', pts:[[5,55],[8,57],[10,58],[14,58],[18,60],[22,63],[20,67],[16,68],[12,65],[10,63],[8,59],[5,56],[5,55]] },
  // British Isles
  { c:'#5e8838', pts:[[-5,50],[0,52],[1,52],[-2,57],[-4,58],[-6,55],[-5,50]] },
  // Madagascar
  { c:'#588830', pts:[[43,-12],[46,-14],[50,-18],[50,-23],[48,-25],[46,-25],[43,-22],[43,-17],[43,-12]] },
  // Greenland (icy)
  { c:'#c8e0f0', pts:[[-52,60],[-42,62],[-30,63],[-20,65],[-18,72],[-24,80],[-40,83],[-52,78],[-56,70],[-52,60]] },
  // India (western edge, partially visible)
  { c:'#789040', pts:[[65,22],[68,20],[72,18],[76,14],[78,8],[75,10],[72,12],[68,14],[65,18],[62,20],[65,22]] },
];

const SEASONS = {
  june: {
    sunRight: true, zenithLat: 23.5, zenithLabel: 'חוג הסרטן 23.5°N',
    factN: { title:'חצי כדור צפוני ☀️ — קיץ', text:'הציר נוטה לשמש<br>יום ארוך • חם<br>ישראל: ~14.6 שע׳ אור' },
    factS: { title:'חצי כדור דרומי ❄️ — חורף', text:'מרוחק מהשמש<br>לילה ארוך • קר<br>ניו-זילנד: ~9.5 שע׳ אור' },
  },
  dec: {
    sunRight: false, zenithLat: -23.5, zenithLabel: 'חוג הגדי 23.5°S',
    factN: { title:'חצי כדור צפוני ❄️ — חורף', text:'הציר מרוחק מהשמש<br>לילה ארוך • קר<br>ישראל: ~10.1 שע׳ אור' },
    factS: { title:'חצי כדור דרומי ☀️ — קיץ', text:'הציר נוטה לשמש<br>יום ארוך • חם<br>ניו-זילנד: ~14.5 שע׳ אור' },
  },
};

function render(key) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#07101f';
  ctx.fillRect(0, 0, W, H);

  const s = SEASONS[key];
  const sr = s.sunRight;
  const SX = sr ? W - 28 : 28;

  // Stars
  if (!render._st) render._st = Array.from({length:55},()=>[Math.random()*W,Math.random()*H,Math.random()*1.1+0.3]);
  ctx.fillStyle = 'rgba(255,255,255,.38)';
  render._st.forEach(([x,y,r2])=>{ ctx.beginPath(); ctx.arc(x,y,r2,0,Math.PI*2); ctx.fill(); });

  // Sun
  const sg = ctx.createRadialGradient(SX,ECY,5,SX,ECY,54);
  sg.addColorStop(0,'#fffde8'); sg.addColorStop(.55,'#ffcc00'); sg.addColorStop(1,'rgba(255,100,0,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(SX,ECY,54,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(SX,ECY,22,0,Math.PI*2); ctx.fill();
  ctx.font = 'bold 8px system-ui'; ctx.fillStyle = '#0a1628'; ctx.textAlign = 'center';
  ctx.fillText('שמש',SX,ECY+3);

  // Sun rays
  ctx.strokeStyle = 'rgba(255,200,0,.35)'; ctx.lineWidth = 1;
  const r0 = sr ? SX-24 : SX+24, r1 = sr ? ECX-R-2 : ECX+R+2;
  for (let yo=-80; yo<=80; yo+=16) { ctx.beginPath(); ctx.moveTo(r0,ECY+yo); ctx.lineTo(r1,ECY+yo); ctx.stroke(); }

  // ── Earth (clipped to globe) ──
  ctx.save();
  ctx.beginPath(); ctx.arc(ECX,ECY,R,0,Math.PI*2); ctx.clip();

  // Night base
  ctx.fillStyle = '#030b18'; ctx.fillRect(ECX-R-2,ECY-R-2,2*R+4,2*R+4);

  // Ocean day-side gradient
  const og = ctx.createRadialGradient(sr?ECX+R*.4:ECX-R*.4,ECY-R*.25,R*.08,ECX,ECY,R);
  og.addColorStop(0,'#52b8e5'); og.addColorStop(.25,'#1878b8'); og.addColorStop(.65,'#0c4278'); og.addColorStop(.9,'#071c50'); og.addColorStop(1,'#020c18');
  ctx.beginPath();
  if (sr) ctx.arc(ECX,ECY,R,-Math.PI/2,Math.PI/2); else ctx.arc(ECX,ECY,R,Math.PI/2,3*Math.PI/2);
  ctx.lineTo(ECX,ECY); ctx.closePath(); ctx.fillStyle=og; ctx.fill();

  // Continents
  REGIONS.forEach(reg => fillR(reg.pts, reg.c));

  // Polar ice caps
  const nPole = proj(0,90), sPole = proj(0,-90);
  if (nPole) { ctx.beginPath(); ctx.arc(nPole[0],nPole[1],R*.16,0,Math.PI*2); ctx.fillStyle='#cce8f5'; ctx.fill(); }
  if (sPole) { ctx.beginPath(); ctx.arc(sPole[0],sPole[1],R*.2,0,Math.PI*2); ctx.fillStyle='#d8eef5'; ctx.fill(); }

  // Night overlay (darkens night hemisphere, allows faint continent silhouettes)
  ctx.beginPath();
  if (sr) ctx.arc(ECX,ECY,R,Math.PI/2,3*Math.PI/2); else ctx.arc(ECX,ECY,R,-Math.PI/2,Math.PI/2);
  ctx.lineTo(ECX,ECY); ctx.closePath(); ctx.fillStyle='rgba(2,8,22,.89)'; ctx.fill();

  // 3D sphere shading / specular highlight
  const sh = ctx.createRadialGradient(sr?ECX+R*.32:ECX-R*.32,ECY-R*.22,R*.05,ECX,ECY,R);
  sh.addColorStop(0,'rgba(255,255,255,.18)'); sh.addColorStop(.38,'rgba(255,255,255,.03)');
  sh.addColorStop(.82,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,30,.34)');
  ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(ECX,ECY,R,0,Math.PI*2); ctx.fill();

  ctx.restore();

  // Earth outline
  ctx.strokeStyle='rgba(0,160,220,.45)'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(ECX,ECY,R,0,Math.PI*2); ctx.stroke();

  // Atmosphere
  const atm=ctx.createRadialGradient(ECX,ECY,R-2,ECX,ECY,R+18);
  atm.addColorStop(0,'rgba(60,160,255,.22)'); atm.addColorStop(.5,'rgba(30,100,200,.06)'); atm.addColorStop(1,'transparent');
  ctx.fillStyle=atm; ctx.beginPath(); ctx.arc(ECX,ECY,R+18,0,Math.PI*2); ctx.fill();

  // Terminator
  ctx.strokeStyle='rgba(0,220,255,.65)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(ECX,ECY-R); ctx.lineTo(ECX,ECY+R); ctx.stroke();
  ctx.setLineDash([]);

  // ── Latitude segments ──
  // Fixed axis: tau = -tan(phi)*tan(TILT); day = right (sr) or left
  [90,66.5,23.5,0,-23.5,-66.5,-90].forEach(ld => {
    const phi=ld*Math.PI/180, sp=Math.sin(phi), cp=Math.cos(phi);
    const cxs=ECX+R*sp*sinT, cys=ECY-R*sp*cosT;
    const hx=R*cp*cosT,      hy=R*cp*sinT;
    const tau_raw=Math.abs(ld)>=89.9?(ld>0?-1:1):-Math.tan(phi)*Math.tan(TILT);
    const tau=Math.max(-1,Math.min(1,tau_raw));
    const xs=cxs+hx*tau, ys=cys+hy*tau;
    const x1=cxs-hx,y1=cys-hy, x2=cxs+hx,y2=cys+hy;
    const col=Math.abs(ld)===0?'rgba(255,80,80,.88)':(Math.abs(ld)===23.5?'rgba(255,200,50,.88)':'rgba(100,220,255,.88)');
    const hl=(ld===0||Math.abs(ld)===66.5||Math.abs(ld)===90); const lw=hl?2.2:1.3;
    const nc=hl?'rgba(20,50,140,.55)':'rgba(20,40,100,.35)';
    if (sr) {
      if (tau<1)  { ctx.beginPath(); ctx.moveTo(xs,ys); ctx.lineTo(x2,y2); ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke(); }
      if (tau>-1) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(xs,ys); ctx.strokeStyle=nc;  ctx.lineWidth=lw; ctx.stroke(); }
    } else {
      if (tau>-1) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(xs,ys); ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke(); }
      if (tau<1)  { ctx.beginPath(); ctx.moveTo(xs,ys); ctx.lineTo(x2,y2); ctx.strokeStyle=nc;  ctx.lineWidth=lw; ctx.stroke(); }
    }
  });

  // ── Axis — always upper-right at 23.5° ──
  const aL=R+18, axNX=ECX+aL*sinT, axNY=ECY-aL*cosT, axSX=ECX-aL*sinT, axSY=ECY+aL*cosT;
  ctx.strokeStyle='#ffd060'; ctx.lineWidth=2.2; ctx.setLineDash([5,3]);
  ctx.beginPath(); ctx.moveTo(axSX,axSY); ctx.lineTo(axNX,axNY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font='bold 9px system-ui'; ctx.fillStyle='#ffd060'; ctx.textAlign='center';
  ctx.fillText('N',axNX,axNY-5); ctx.fillText('S',axSX,axSY+11);
  // Tilt angle arc + label
  ctx.strokeStyle='rgba(255,200,0,.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(ECX,ECY-R-2,14,-Math.PI/2,-Math.PI/2+TILT,false); ctx.stroke();
  ctx.font='8.5px system-ui'; ctx.fillStyle='#ffd060'; ctx.textAlign='left';
  ctx.fillText('23.5°',axNX+3,axNY+1);

  // ── Zenith (sub-solar point) ──
  const zL=s.zenithLat*Math.PI/180;
  const zenX=ECX+(sr?1:-1)*R*Math.cos(zL), zenY=ECY-R*Math.sin(zL);
  ctx.beginPath(); ctx.arc(zenX,zenY,5.5,0,Math.PI*2); ctx.fillStyle='#ff8c42'; ctx.fill();
  ctx.font='7.5px system-ui'; ctx.fillStyle='#ff8c42'; ctx.textAlign=sr?'right':'left';
  ctx.fillText(s.zenithLabel, zenX+(sr?-8:8), zenY+3);

  // Day / Night labels
  ctx.font='bold 9px system-ui'; ctx.textAlign='center';
  ctx.fillStyle='rgba(255,210,80,.72)'; ctx.fillText('יום',sr?ECX+R*.55:ECX-R*.55,ECY+R+14);
  ctx.fillStyle='rgba(80,120,200,.62)'; ctx.fillText('לילה',sr?ECX-R*.55:ECX+R*.55,ECY+R+14);

  // Hemisphere labels (in night zone for contrast)
  const phH=38*Math.PI/180, hx2=ECX+(sr?-1:1)*R*Math.cos(phH);
  ctx.font='bold 8px system-ui'; ctx.textAlign=sr?'right':'left';
  ctx.fillStyle=sr?'#ff8c42':'#4fc3f7';
  ctx.fillText(sr?'☀ קיץ':'❄ חורף',hx2+(sr?-3:3),ECY-R*Math.sin(phH));
  ctx.fillStyle=sr?'#4fc3f7':'#ff8c42';
  ctx.fillText(sr?'❄ חורף':'☀ קיץ',hx2+(sr?-3:3),ECY+R*Math.sin(phH));

  // Update info cards
  document.getElementById('fn-title').textContent=s.factN.title;
  document.getElementById('fn-text').innerHTML=s.factN.text;
  document.getElementById('fs-title').textContent=s.factS.title;
  document.getElementById('fs-text').innerHTML=s.factS.text;
}

function setSeason(k) {
  document.getElementById('btn-june').classList.toggle('active',k==='june');
  document.getElementById('btn-dec').classList.toggle('active',k==='dec');
  render(k);
}
render('june');
</script>
</body>
</html>
