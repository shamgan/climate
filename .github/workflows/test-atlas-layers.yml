name: Test climate atlas layers

on:
  push:
    paths:
      - 'atlas/**'
      - '.github/workflows/test-atlas-layers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          if command -v google-chrome >/dev/null; then
            echo "ATLAS_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Check monthly layers and responsive interactions
        run: python -u atlas/scripts/check_interface.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-previews
          path: atlas/*.png
          if-no-files-found: ignore

