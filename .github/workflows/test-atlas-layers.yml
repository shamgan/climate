name: Test climate atlas layers

on:
  push:
    paths:
      - 'atlas/**'
      - '.github/workflows/test-atlas-layers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          if command -v google-chrome >/dev/null; then
            echo "ATLAS_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Check monthly layers and responsive interactions
        run: python -u atlas/scripts/check_interface.py
      - name: Check new solar and circulation models
        if: ${{ !cancelled() }}
        run: |
          node atlas/scripts/check_solar.cjs
          node atlas/scripts/check_atmosphere.cjs
          node atlas/scripts/check_places.cjs
      - name: Check additive teaching layers and preserve existing layers
        if: ${{ !cancelled() }}
        run: python -u atlas/scripts/check_learning.py
      - name: Check navigation, boundaries, reset and desert switch
        if: ${{ !cancelled() }}
        run: python -u atlas/scripts/check_navigation.py
      - name: Check city climatologies, climographs and selected-city markers
        if: ${{ !cancelled() }}
        run: python -u atlas/scripts/check_cities.py
      - name: Check persistent desert overlay on all map layers
        if: ${{ !cancelled() }}
        run: python -u atlas/scripts/check_desert.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-previews
          path: atlas/*.png
          if-no-files-found: ignore


