name: Capture atlas review
on:
  push:
    paths:
      - '.github/workflows/review-atlas-rendering.yml'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python -u atlas/scripts/check_browser.py
      - name: Preserve review screenshots on a separate review branch
        run: |
          git checkout -b atlas-render-review-20261023
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/*.png
          git commit -m "Capture rendered atlas review evidence"
          git push origin HEAD:atlas-render-review-20261023
