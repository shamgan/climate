name: Build twelve-month atlas climate layers
on:
  push:
    branches: [atlas-ui-review2-data]
    paths:
      - 'atlas/scripts/build_era5_layers.py'
      - '.github/workflows/build-atlas-era5.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-era5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-era5:
    if: github.ref == 'refs/heads/atlas-ui-review2-data'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install 'numpy>=2,<3' 'xarray>=2025,<2027' 'netCDF4>=1.7,<2'
      - run: python -u atlas/scripts/build_era5_layers.py
      - name: Save verified climate grids on the isolated data branch
        env:
          DATA_BRANCH: atlas-ui-review2-data
        run: |
          test "${GITHUB_REF_NAME}" = "${DATA_BRANCH}"
          git fetch origin "${DATA_BRANCH}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${DATA_BRANCH}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/data/era5/manifest.json atlas/data/era5/*.bin.gz
          if ! git diff --cached --quiet; then
            git commit -m "Add all twelve genuine ERA5 monthly normals with original January and July preserved"
            git push origin "HEAD:${DATA_BRANCH}"
          fi
