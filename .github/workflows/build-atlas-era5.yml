name: Build detailed atlas climate layers
on:
  push:
    paths:
      - 'atlas/scripts/build_era5_layers.py'
      - '.github/workflows/build-atlas-era5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-era5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install 'numpy>=2,<3' 'xarray>=2025,<2027' 'netCDF4>=1.7,<2'
      - run: python -u atlas/scripts/build_era5_layers.py
      - name: Save verified climate grids
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/data/era5
          if ! git diff --cached --quiet; then
            git commit -m "Prepare real quarter-degree January and July ERA5 climate normals"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
