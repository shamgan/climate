name: Verify published climate atlas

on:
  push:
    branches: [main]
    paths:
      - 'atlas/**'
      - '.github/workflows/verify-climate-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Verify public HTML against the committed atlas
        env:
          ATLAS_URL: https://shamgan.github.io/climate/atlas/
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { setTimeout } from 'node:timers/promises';
          import assert from 'node:assert/strict';

          const expected = readFileSync('atlas/index.html');
          const sha256 = data => createHash('sha256').update(data).digest('hex');
          const expectedHash = sha256(expected);
          const url = process.env.ATLAS_URL;
          let verified = false;
          let lastResult = '';
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const response = await fetch(url + '?verify=' + process.env.GITHUB_SHA + '&attempt=' + attempt, {
                signal: AbortSignal.timeout(15000),
                headers: { 'Cache-Control': 'no-cache' }
              });
              const bytes = Buffer.from(await response.arrayBuffer());
              const actualHash = sha256(bytes);
              lastResult = 'HTTP ' + response.status + ', SHA256 ' + actualHash;
              if (response.ok && (response.headers.get('content-type') || '').includes('text/html') && actualHash === expectedHash) {
                const html = bytes.toString('utf8');
                for (const text of [
                  'כל האזורים יחד',
                  'אזורי אקלים עיקריים',
                  'משווני / טרופי משווני',
                  'כמות משקעים שנתית מתחת ל 200 מ"מ ויובש רב',
                  'עונה יבשה בחורף וגשמים רבים בחודשי הקיץ (עונה רטובה)',
                  'קוטבי ותת קוטבי',
                  'תת קוטבי / סובפולרי'
                ]) assert.ok(html.includes(text), 'Missing required content: ' + text);
                assert.ok(!html.includes('map-original.jpg'));
                assert.ok(!html.includes('map-index.png'));
                console.log('VERIFIED_PUBLIC_URL=' + url);
                console.log('HTTP_STATUS=' + response.status);
                console.log('HTML_SHA256=' + actualHash);
                console.log('REQUIRED_CONTENT_CHECKS=passed');
                for (const asset of ['cities.js','cities.css','data/cities/climatology.json','navigation.js','navigation.css','data/boundaries/countries.json','learning-layers.js','learning-layers.css','solar-model.js','atmosphere-model.js','data/terrain/manifest.json','data/terrain/elevation-01deg.bin.gz','interface.js','interface.css','layers.js','layers.css','currents.js','data/era5/manifest.json','data/era5/temperature-01.bin.gz','data/era5/temperature-07.bin.gz','data/era5/precipitation-01.bin.gz','data/era5/precipitation-07.bin.gz']) {
                  const assetResponse = await fetch(url + asset + '?verify=' + process.env.GITHUB_SHA, {signal: AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
                  assert.equal(assetResponse.status, 200, asset + ' HTTP status');
                  const actual = Buffer.from(await assetResponse.arrayBuffer());
                  assert.equal(sha256(actual), sha256(readFileSync('atlas/' + asset)), asset + ' published bytes');
                  console.log('VERIFIED_ASSET=' + asset);
                }
                assert.ok(html.includes('נוצר על ידי נדב שמגר באמצעות בינה מלאכותית'));
                assert.ok(html.includes('latitudeLabels'));
                assert.ok(html.includes('currentsToggle'));
                const climate = JSON.parse(readFileSync('atlas/data/era5/manifest.json'));
                assert.equal(climate.period, '1991–2020');
                for (const key of ['temperature','precipitation']) {
                  const layer = climate.layers[key];
                  assert.equal(layer.longitudes.length, 1440);
                  assert.equal(layer.latitudes.length, 721);
                  for (const month of [1,7]) assert.ok(layer.frames[month].sha256);
                }
                verified = true;
                break;
              }
            } catch (error) {
              lastResult = error.message;
            }
            console.log('Attempt ' + attempt + ': ' + lastResult);
            if (attempt < 24) await setTimeout(10000);
          }
          assert.ok(verified, 'Published atlas did not match committed content: ' + lastResult);
          JS

